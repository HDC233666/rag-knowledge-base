<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG 知识库问答</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9A</text></svg>" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">📚 RAG 知识库问答</div>
      <div class="meta" id="meta">加载中…</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2>知识库 <span class="pill" id="stats">–</span></h2>
        <div class="collections">
          <select id="collection" aria-label="选择知识库"></select>
          <button id="new-collection" type="button" title="新建知识库">＋</button>
        </div>
        <p class="hint" id="collection-hint">默认知识库</p>
        <label class="upload">
          <input id="file" type="file" accept=".txt,.md,.markdown,.pdf,.csv,.log" hidden />
          <span>＋ 上传文档到当前知识库</span>
        </label>
        <ul class="docs" id="docs"></ul>
        <p class="hint">支持 txt / md / pdf / csv，单文件 ≤ 20MB</p>
      </aside>

      <main class="chat">
        <div class="messages" id="messages">
          <div class="welcome">
            <h3>先上传文档，再提问试试 👇</h3>
            <p>示例：「什么是 RAG？」「BM25 和向量检索有什么区别？」</p>
          </div>
        </div>
        <form class="composer" id="form">
          <textarea id="question" rows="2" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
          <button id="send" type="submit">提问</button>
        </form>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
